{% extends 'base.html' %}

{% block content %}
    <div class="container mt-4">
        <h1>Удалить задачу</h1>
        <p>Вы точно хотите удалить задачу: <strong>{{ task.summary }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'task_detail' task.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
{% endblock %}
