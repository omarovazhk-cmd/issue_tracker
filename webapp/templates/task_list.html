{% extends 'base.html' %}

{% block content %}
    <div class="container mt-4">
        <h1>Список задач</h1>

        <a class="btn btn-primary mb-3" href="{% url 'task_add' %}">Добавить задачу</a>

        <ul class="list-group">
            {% for task in tasks %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="{% url 'task_detail' task.pk %}">
                        {{ task.summary }}
                    </a>
                    <span>
                    {{ task.task_type }} | {{ task.status }}
                </span>
                </li>
            {% empty %}
                <li class="list-group-item">Задач пока нет.</li>
            {% endfor %}
        </ul>
    </div>
{% endblock %}
